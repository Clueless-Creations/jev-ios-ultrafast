[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-ios-ultrafast"
version = "0.1.0"
description = "A local iOS Simulator action loop using Jev's indexed decisions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jev-ios = "jev_ios.cli:main"

[tool.setuptools.packages.find]
include = ["jev_ios*"]
